---
base : 
  project_name: "fraud-detector-mlops"
  random_state: 42
data:
  raw_data_path: "data/raw/raw_with_target.csv"
  processed_dir: "data/processed"
  train_path: "data/processed/train.parquet"
  test_path: "data/processed/test.parquet"
  temporal_split_column: "step"
  test_split_ratio: 0.20
  target_col: "isFraud"
  drop_cols:
    - "nameOrig"
    - "nameDest"
    - "isFlaggedFraud"

preprocessing:
  artifacts_dir: "artifacts"
  preprocessor_path: "artifacts/preprocessor.joblib"
  train_features_path: "data/processed/train_features.parquet"
  test_features_path: "data/processed/test_features.parquet"
  categorical_features:
    - "type"
  numeric_features:
    - "step"
    - "amount"
    - "oldbalanceOrg"
    - "newbalanceOrig"
    - "oldbalanceDest"
    - "newbalanceDest"
    - "errorBalanceOrig"
    - "errorBalanceDest"
train:
  model_dir: "artiacts"
  model_path: "artifacts/model.json"
  experiment_name: "fraud-detector-training"
  algorithm: "xgboost"
  params:
    n_estimators: 50        # Reduce tree count (was 100)
    max_depth: 2            # Shallow trees prevent memorization (was 4)
    learning_rate: 0.03     # Smaller step size
    min_child_weight: 5     # Requires more samples per leaf node
    gamma: 1.0              # Minimum loss reduction to make a split
    reg_alpha: 1.0          # L1 regularization
    reg_lambda: 2.0         # L2 regularization
    subsample: 0.7
    colsample_bytree: 0.7


evaluate:
  metrics_output_path: "artifacts/metrics.json"
  min_test_pr_auc: 0.05          # Matches current baseline (~0.064)
  min_test_roc_auc: 0.55         # Matches current baseline (~0.590)
  max_auc_drop_ratio: 0.40       # Matches current drop (~35%)